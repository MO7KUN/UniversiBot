name: UniversiBot CI
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f deploy/cloud-simulation.yml config --quiet
  rasa:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose build
      - run: docker compose --profile tools run --rm train data validate --fail-on-warnings
      - run: docker compose --profile tools run --rm train
      - run: mkdir -p results && chmod 777 results
      - run: docker compose --profile tools run --rm -v ./results:/app/results train test nlu --model /app/models/universibot.tar.gz --nlu tests/nlu.yml --out /app/results/nlu
      - run: docker compose --profile tools run --rm -v ./results:/app/results train test core --model /app/models/universibot.tar.gz --stories tests/test_stories.yml --out /app/results/core
      - run: docker compose up -d --wait --wait-timeout 240
      - run: node scripts/smoke.mjs
      - name: Build isolated cloud simulation
        run: docker compose -p universibot-cloud -f docker-compose.yml -f deploy/cloud-simulation.yml build
      - name: Train isolated cloud simulation
        run: docker compose -p universibot-cloud -f docker-compose.yml -f deploy/cloud-simulation.yml --profile tools run --rm train
      - name: Start isolated cloud simulation
        run: docker compose -p universibot-cloud -f docker-compose.yml -f deploy/cloud-simulation.yml up -d --wait --wait-timeout 240
      - name: Test isolated cloud simulation
        env:
          UNIVERSIBOT_URL: http://localhost:8081
        run: node scripts/smoke.mjs
      - if: always()
        run: docker compose logs --no-color > results/containers.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rasa-evaluation
          path: results/
      - if: always()
        run: docker compose down
      - if: always()
        run: docker compose -p universibot-cloud -f docker-compose.yml -f deploy/cloud-simulation.yml down
